<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/app.css" />
    <title>Song Request Control Panel</title>
  </head>
  <body>
    <div class="container">
      <div class="grid">
        <div class="main">
          <div class="panel">
            <h2>Now Playing</h2>
            <div class="now-playing" id="nowPlaying">
              <div class="player-wrapper">
                <div id="player">
                  <div class="loading">Loading player...</div>
                </div>
              </div>
              <div class="song-info">
                <img class="thumbnail-img" id="currentThumbnail" alt="" />
                <div class="details">
                  <div class="title" id="currentTitle"></div>
                  <div class="channel" id="currentChannel"></div>
                  <div class="meta">
                    <span id="currentViews"></span>
                    <span id="currentDuration"></span>
                    <span class="requester" id="currentRequester"></span>
                  </div>
                </div>
              </div>
              <div class="player-controls">
                <button class="btn" onclick="skipCurrent()">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5v14m8-14v14" />
                  </svg>

                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                    <path
                      stroke="currentColor"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M16.658 9.286c1.44.9 2.16 1.35 2.407 1.926a2 2 0 0 1 0 1.576c-.247.576-.967 1.026-2.407 1.926L9.896 18.94c-1.598.999-2.397 1.498-3.056 1.445a2 2 0 0 1-1.446-.801C5 19.053 5 18.111 5 16.226V7.774c0-1.885 0-2.827.394-3.358a2 2 0 0 1 1.446-.801c.66-.053 1.458.446 3.056 1.445z"
                    />
                  </svg>
                </button>
                <button class="btn" onclick="skipCurrent()">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                    <path
                      stroke="currentColor"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M17 5v14M7 7.329v9.342c0 1.066 0 1.599.218 1.872a1 1 0 0 0 .783.376c.35 0 .766-.333 1.599-.999l4.277-3.421c1.067-.854 1.601-1.281 1.794-1.797a2 2 0 0 0 0-1.404c-.193-.516-.727-.943-1.794-1.797L9.6 6.08C8.767 5.414 8.35 5.08 8 5.08a1 1 0 0 0-.783.377C7 5.73 7 6.263 7 7.329"
                    />
                  </svg>
                </button>
              </div>
            </div>
            <div class="empty" id="noPlaying">Nothing playing</div>
          </div>

          <div class="panel">
            <h2>Add Song</h2>
            <div class="add-song">
              <input class="input" type="text" id="searchInput" placeholder="YouTube URL or song name..." />
              <button class="btn" onclick="search()">Search</button>
            </div>
            <div class="panel-content">
              <div class="row-list hidden" id="searchResults"></div>
            </div>
            <div class="error hidden" id="searchError"></div>
          </div>

          <div class="panel">
            <div class="queue-header">
              <div class="start">
                <h2>Queue</h2>
                <span class="queue-count" id="queueCount">0</span>
              </div>
              <div class="end">
                <button class="btn btn-danger" onclick="clearQueue()">Clear Queue</button>
              </div>
            </div>
            <div class="panel-content">
              <div class="row-list" id="queueList"></div>
            </div>
          </div>

          <div class="panel">
            <h2>Jam Playlist</h2>
            <div id="fallbackInfo" class="panel-subtext"></div>
            <div class="panel-content">
              <div id="fallbackList" class="row-list"></div>
            </div>
            <button class="btn" onclick="refreshFallback()">Refresh now</button>
          </div>
        </div>

        <div class="sidebar">
          <div class="panel">
            <h2>Preview Settings</h2>
            <label class="checkbox-row">
              <input type="checkbox" id="showVideo" onchange="saveSettings()" />
              Show video (вместо thumbnail)
            </label>
            <div class="preview-url">OBS URL: <a href="/preview" target="_blank" style="color: #3b82f6">/preview</a></div>
          </div>

          <div class="panel">
            <h2>Bot Settings</h2>
            <div class="bot-settings">
              <label>
                YouTube API Key
                <input class="input" type="password" id="secYoutubeKey" placeholder="оставь пустым, чтобы не менять" autocomplete="off" />
              </label>
              <div id="secretsStatus" class="panel-subtext"></div>

              <label>
                Min views
                <input class="input" type="number" id="cfgMinViews" min="0" />
              </label>
              <label>
                Max duration (sec)
                <input class="input" type="number" id="cfgMaxDuration" min="0" />
              </label>
              <label>
                Max queue size
                <input class="input" type="number" id="cfgMaxQueue" min="1" />
              </label>
              <label>
                Max requests per user
                <input class="input" type="number" id="cfgMaxPerUser" min="0" />
              </label>
              <label>
                Cooldown (sec)
                <input class="input" type="number" id="cfgCooldown" min="0" />
              </label>
              <label>
                Fallback playlist ID
                <input class="input" type="text" id="cfgFallbackPlaylist" placeholder="PL..." />
              </label>
            </div>
            <button class="btn" onclick="saveConfig()">Save settings</button>
            <button class="btn" onclick="saveSecrets()">Save keys</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="js/shared.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
