<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/app.css" />
    <title>Song Control Panel</title>
  </head>
  <body>
    <div class="container">
      <div class="grid">
        <div class="main">
          <div class="panel">
            <h2>Now Playing</h2>
            <div class="now-playing" id="nowPlaying">
              <div class="player-wrapper">
                <div id="player">
                  <div class="loading">Loading player...</div>
                </div>
              </div>
              <div class="song-info">
                <img class="thumbnail-img" id="currentThumbnail" alt="" />
                <div class="details">
                  <div class="title text-lg" id="currentTitle"></div>
                  <div class="channel text-md text-secondary" id="currentChannel"></div>
                  <div class="meta text-sm text-muted">
                    <span id="currentViews"></span>
                    <span id="currentDuration"></span>
                    <span class="requester" id="currentRequester"></span>
                  </div>
                </div>
              </div>
            </div>
            <div class="empty" id="noPlaying">Nothing playing</div>
          </div>

          <div class="panel">
            <h2>Add Song</h2>
            <div class="row">
              <input class="input" type="text" id="searchInput" placeholder="YouTube URL or song name..." />
              <button id="searchBtn" class="btn" onclick="search()">Search</button>
            </div>
            <div class="panel-content">
              <div class="row-list hidden" id="searchResults"></div>
            </div>
            <div class="error hidden" id="searchError"></div>
          </div>

          <div class="panel">
            <div class="queue-header">
              <div>
                <h2>Queue</h2>
                <span class="text-sm text-secondary" id="queueCount">0</span>
              </div>
              <div>
                <button id="clearQueueBtn" class="btn btn-danger" onclick="clearQueue()">Clear Queue</button>
              </div>
            </div>
            <div class="panel-content">
              <div class="row-list" id="queueList"></div>
            </div>
          </div>

          <div class="panel">
            <div class="queue-header">
              <div>
                <h2>Jam Playlist</h2>
                <div id="fallbackInfo" class="text-sm text-secondary"></div>
              </div>
              <div class="panel-actions row">
                <button id="fallbackShuffleBtn" class="btn btn-icon" onclick="toggleFallbackShuffle()" title="Shuffle">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                    <path
                      stroke="currentColor"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="m18 4 3 3m0 0-3 3m3-3h-4c-.93 0-1.394 0-1.78.077a4 4 0 0 0-3.143 3.143C12 10.606 12 11.07 12 12s0 1.394-.077 1.78a4 4 0 0 1-3.143 3.143C8.394 17 7.93 17 7 17H3m15 3 3-3m0 0-3-3m3 3h-4c-.93 0-1.394 0-1.78-.077a4 4 0 0 1-.22-.05M3 7h4c.93 0 1.394 0 1.78.077q.111.022.22.05"
                    />
                  </svg>
                </button>
                <button id="fallbackRepeatBtn" class="btn btn-icon" onclick="toggleFallbackRepeat()" title="Repeat">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                    <path
                      stroke="currentColor"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M14 7h2a6 6 0 0 1 0 12H8A6 6 0 0 1 8 7h2M7 4l3 3m0 0-3 3"
                    />
                  </svg>
                </button>
                <button id="fallbackRefreshBtn" class="btn btn-icon" onclick="refreshFallback()" title="Refresh">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                    <path
                      stroke="currentColor"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M4 4v5h.582m15.356 2A8.001 8.001 0 0 0 4.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 0 1-15.357-2m15.357 2H15"
                    />
                  </svg>
                </button>
                <label class="switch" title="Enable playlist">
                  <input type="checkbox" id="fallbackEnabledToggle" onchange="toggleFallbackEnabled()" />
                  <span class="switch-track"></span>
                </label>
              </div>
            </div>
            <div class="panel-content">
              <div id="fallbackList" class="row-list"></div>
            </div>
          </div>
        </div>

        <div class="sidebar">
          <div class="panel">
            <h2>Preview Settings</h2>
            <label class="row">
              <input type="checkbox" id="showVideo" onchange="savePreviewSettings()" />
              Показать видео
            </label>
            <div class="preview-url">OBS URL: <a href="/preview" target="_blank">/preview</a></div>

            <div class="row">
              <button id="playPauseBtn" class="btn btn-icon" onclick="playPauseCurrent()">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                  <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5v14m8-14v14" />
                </svg>
              </button>
              <button class="btn btn-icon" onclick="skipCurrent()">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                  <path
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M17 5v14M7 7.329v9.342c0 1.066 0 1.599.218 1.872a1 1 0 0 0 .783.376c.35 0 .766-.333 1.599-.999l4.277-3.421c1.067-.854 1.601-1.281 1.794-1.797a2 2 0 0 0 0-1.404c-.193-.516-.727-.943-1.794-1.797L9.6 6.08C8.767 5.414 8.35 5.08 8 5.08a1 1 0 0 0-.783.377C7 5.73 7 6.263 7 7.329"
                  />
                </svg>
              </button>
            </div>
          </div>

          <div class="panel">
            <h2>Bot Settings</h2>
            <div class="bot-settings">
              <div>
                <label>
                  YouTube API Key
                  <input class="input" type="password" id="secYoutubeKey" placeholder="оставь пустым, чтобы не менять" autocomplete="off" />
                </label>
                <div id="secretsStatus" class="text-xs text-muted"></div>
              </div>

              <label>
                Min views
                <input class="input" type="number" id="cfgMinViews" min="0" />
              </label>
              <label>
                Min duration (sec)
                <input class="input" type="number" id="cfgMinDuration" min="0" />
              </label>
              <label>
                Max duration (sec)
                <input class="input" type="number" id="cfgMaxDuration" min="0" />
              </label>
              <label>
                Max queue size
                <input class="input" type="number" id="cfgMaxQueue" min="1" />
              </label>
              <label>
                Max requests per user
                <input class="input" type="number" id="cfgMaxPerUser" min="0" />
              </label>
              <label>
                Fallback playlist
                <input class="input" type="text" id="cfgFallbackPlaylist" placeholder="ID or link to playlist" />
              </label>
            </div>
            <button id="saveConfigSettingBtn" class="btn" onclick="saveConfigSetting()">Save settings</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="js/icons.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
