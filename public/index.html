<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/app.css" />
    <title>Song Request Control Panel</title>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🎵 Song Request Control Panel</h1>
      </div>

      <div class="grid">
        <div class="main">
          <div class="panel">
            <h2>Now Playing</h2>
            <div class="now-playing" id="nowPlaying">
              <div class="player-wrapper">
                <div id="player">
                  <div class="loading">Loading player...</div>
                </div>
              </div>
              <div class="song-info">
                <img class="thumbnail" id="currentThumbnail" alt="" />
                <div class="details">
                  <div class="title" id="currentTitle"></div>
                  <div class="channel" id="currentChannel"></div>
                  <div class="meta">
                    <span id="currentViews"></span>
                    <span id="currentDuration"></span>
                    <span class="requester" id="currentRequester"></span>
                  </div>
                </div>
              </div>
              <div class="player-controls">
                <button onclick="skipCurrent()">Skip</button>
              </div>
            </div>
            <div class="empty" id="noPlaying">Nothing playing</div>
          </div>

          <div class="panel">
            <h2>Add Song</h2>
            <div class="add-song">
              <input type="text" id="searchInput" placeholder="YouTube URL or song name..." />
              <button onclick="search()">Search</button>
            </div>
            <div class="search-results hidden" id="searchResults"></div>
            <div class="error hidden" id="searchError"></div>
          </div>

          <div class="panel">
            <div class="queue-header">
              <h2>Queue</h2>
              <span class="queue-count" id="queueCount">0</span>
            </div>
            <div id="queueList"></div>
          </div>
        </div>

        <div class="sidebar">
          <div class="panel">
            <h2>Preview Settings</h2>
            <div class="preview-settings">
              <label>
                <input type="checkbox" id="showVideo" checked onchange="saveSettings()" />
                Show video
              </label>
              <label>
                <input type="checkbox" id="showSongInfo" checked onchange="saveSettings()" />
                Show song info
              </label>
              <label>
                <input type="checkbox" id="showThumbnail" onchange="saveSettings()" />
                Show thumbnail
              </label>
              <label>
                <input type="checkbox" id="showRequester" checked onchange="saveSettings()" />
                Show requester
              </label>
              <label>
                <input type="checkbox" id="showQueue" checked onchange="saveSettings()" />
                Show queue
              </label>
            </div>
            <div class="preview-url">OBS URL: <a href="/preview" target="_blank" style="color: #3b82f6">/preview</a></div>
          </div>

          <div class="panel">
            <h2>Queue Controls</h2>
            <button class="danger" onclick="clearQueue()" style="width: 100%">Clear Queue</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="js/app.js"></script>
  </body>
</html>
