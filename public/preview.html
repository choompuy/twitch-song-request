<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/preview.css" />
    <title>Song Request Preview</title>
  </head>
  <body>
    <div class="container">
      <div class="now-playing-badge" id="nowPlaying">
        <img class="thumbnail" id="currentThumbnail" alt="" />
        <div class="text">
          <div class="title" id="currentTitle"></div>
          <div class="channel" id="currentChannel"></div>
        </div>
      </div>

      <div class="player-wrapper" id="playerWrapper">
        <div id="player"></div>
      </div>
    </div>

    <script src="js/shared.js"></script>
    <script src="js/preview.js"></script>
  </body>
</html>
